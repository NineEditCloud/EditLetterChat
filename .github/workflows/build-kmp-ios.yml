# ============================================================
# GitHub Actions - KMP 项目 macOS/iOS 自动编译配置
# 项目：EditLetterChat
# Gradle: 9.0.0 | Kotlin: 2.1.20 | JDK: 21 | CMP: 1.9.0-rc01
# ============================================================

name: Build KMP (iOS & macOS)

# ---------- 触发条件 ----------
on:
  push:
    branches: [ main, master, develop, release/* ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # 支持手动触发（可传入参数）
    inputs:
      build_type:
        description: '构建类型'
        required: false
        default: 'all'
        type: choice
        options:
          - all         # 构建所有平台
          - ios-only    # 仅 iOS
          - framework   # 仅编译 Kotlin/Native Framework

# ---------- 环境变量 ----------
env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=4"
  JAVA_DIST: 'temurin'
  JAVA_VERSION: '21'          # 项目使用 JDK 21
  XCODE_VERSION: '16.2'      # macOS-14 自带 Xcode 版本

# ---------- 并行任务 ----------
jobs:
  # ==================== 任务1: 编译 iOS Kotlin/Native Framework ====================
  build-ios-framework:
    name: 📱 Build iOS Framework (Kotlin/Native)
    runs-on: macos-14
    timeout-minutes: 60
    
    steps:
      # ---- 1. 检出代码 ----
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive  # 如果有 git submodule
      
      # ---- 2. 配置 JDK 21 ----
      - name: ☕ Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DIST }}
      
      # ---- 3. 配置 Gradle (自动缓存依赖) ----
      - name: 📦 Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true
      
      # ---- 4. 授权 Xcode (首次运行需要) ----
      - name: 🔑 Accept Xcode License
        run: |
          sudo xcodebuild -license accept
          sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer || true
      
      # ---- 5. 安装 CocoaPods 依赖 ----
      - name: 🌿 Install CocoaPods Dependencies
        working-directory: ./iosApp
        run: |
          pod install --repo-update || pod install
        continue-on-error: false  # CocoaPods 失败则终止
      
      # ---- 6. 编译 iOS Framework (全架构) ----
      - name: 🔨 Build iOS Framework (All Architectures)
        run: |
          echo "========== 开始编译 iOS Framework =========="
          echo "目标架构: iosArm64, iosX64, iosSimulatorArm64"
          echo "============================================="
          
          # 编译所有 iOS 目标的 Release Framework
          ./gradlew :composeApp:linkReleaseFrameworkIosArm64 \
                    :composeApp:linkReleaseFrameworkIosX64 \
                    :composeApp:linkReleaseFrameworkIosSimulatorArm64 \
                    --stacktrace \
                    --info \
                    --no-daemon \
                    --build-cache || {
            echo "⚠️ Release 构建失败，尝试 Debug 构建..."
            ./gradlew :composeApp:linkDebugFrameworkIosArm64 \
                      :composeApp:linkDebugFrameworkIosX64 \
                      :composeApp:linkDebugFrameworkIosSimulatorArm64 \
                      --stacktrace \
                      --no-daemon
          }
      
      # ---- 7. 上传 Framework 产物 ----
      - name: 📤 Upload iOS Framework Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-framework-${{ github.run_id }}
          path: |
            composeApp/build/bin/iosArm64/releaseFramework/**/*.framework
            composeApp/build/bin/iosX64/releaseFramework/**/*.framework
            composeApp/build/bin/iosSimulatorArm64/releaseFramework/**/*.framework
            composeApp/build/bin/iosArm64/debugFramework/**/*.framework
            composeApp/build/bin/iosX64/debugFramework/**/*.framework
            composeApp/build/bin/iosSimulatorArm64/debugFramework/**/*.framework
          retention-days: 7
          if-no-files-found: warn
  
  # ==================== 任务2: 编译完整 iOS 应用 (.ipa) ====================
  build-ios-ipa:
    name: 🍎 Build iOS App (.ipa)
    runs-on: macos-14
    needs: build-ios-framework  # 依赖 Framework 构建成功
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 90
    
    steps:
      # ---- 1. 检出代码 ----
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
      
      # ---- 2. 配置环境 ----
      - name: ☕ Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DIST }}
      
      - name: 📦 Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      
      - name: 🔑 Accept Xcode License
        run: |
          sudo xcodebuild -license accept
          sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer || true
      
      # ---- 3. 安装 Apple 签名证书 ----
      - name: 🔐 Install Apple Signing Certificate
        if: github.event_name != 'pull_request'
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # 创建临时钥匙串
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          
          # 导入 P12 证书
          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 \
                     -P "$IOS_CERTIFICATE_PASSWORD" \
                     -A \
                     -k $KEYCHAIN_PATH
          
          # 设置钥匙串权限
          security set-key-partition-list \
              -S apple-tool:,apple: \
              -s -k "$KEYCHAIN_PASSWORD" \
              $KEYCHAIN_PATH
          
          # 安装描述文件
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_PROVISION_PROFILE_BASE64" | base64 --decode > $RUNNER_TEMP/profile.mobileprovision
          cp $RUNNER_TEMP/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
          
          # 设置默认钥匙串
          security list-keychains -d user -s $KEYCHAIN_PATH login.keychain
      
      # ---- 4. CocoaPods & Gradle 构建 Framework ----
      - name: 🌿 Install CocoaPods & Build Framework
        working-directory: ./iosApp
        run: |
          pod install --repo-update
          
          cd ..
          ./gradlew :composeApp:linkReleaseFrameworkIosArm64 \
                    :composeApp:linkReleaseFrameworkIosSimulatorArm64 \
                    --no-daemon \
                    --build-cache
      
      # ---- 5. Xcode Archive & Export IPA ----
      - name: 🏗️ Build iOS Archive (.xcarchive)
        working-directory: ./iosApp
        run: |
          xcodebuild -workspace iosApp.xcworkspace \
                     -scheme iosApp \
                     -sdk iphoneos \
                     -configuration Release \
                     -archivePath $RUNNER_TEMP/iosApp.xcarchive \
                     archive \
                     CODE_SIGN_IDENTITY="Apple Distribution" \
                     PROVISIONING_PROFILE_SPECIFIER="${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}" \
                     CODE_SIGN_STYLE=Manual \
                     -allowProvisioningUpdates | xcpretty
      
      - name: 📦 Export IPA
        working-directory: ./iosApp
        run: |
          # 确保 ExportOptions.plist 存在
          if [ ! -f "ExportOptions.plist" ]; then
            cat > ExportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>${{ secrets.APPLE_TEAM_ID }}</string>
              <key>uploadBitcode</key>
              <false/>
              <key>uploadSymbols</key>
              <true/>
              <key>compileBitcode</key>
              <false/>
              <key>signingStyle</key>
              <string>manual</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>destination</key>
              <string>upload</string>
          </dict>
          </plist>
          EOF
          fi
          
          xcodebuild -exportArchive \
                     -archivePath $RUNNER_TEMP/iosApp.xcarchive \
                     -exportOptionsPlist ExportOptions.plist \
                     -exportPath $RUNNER_TEMP/export \
                     -allowProvisioningUpdates | xcpretty
          
          # 重命名产物
          mv $RUNNER_TEMP/export/*.ipa $RUNNER_TEMP/EditLetterChat-${{ github.run_number }}.ipa
      
      # ---- 6. 上传 IPA ----
      - name: 📤 Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-${{ github.run_id }}
          path: ${{ runner.temp }}/*.ipa
          retention-days: 30
      
      # ---- 7. (可选) 自动上传到 TestFlight/App Store Connect ----
      - name: 🚀 Upload to App Store Connect
        if: success()
        uses: applesci/action-app-store-connect@master
        with:
          app-id: ${{ secrets.ASC_APP_ID }}           # App Store Connect App ID
          ipa-path: ${{ runner.temp }}/EditLetterChat-${{ github.run_number }}.ipa
          api-key-id: ${{ secrets.ASC_API_KEY_ID }}
          api-private-key: ${{ secrets.ASC_API_PRIVATE_KEY }}
          issuer-id: ${{ secrets.ASC_ISSUER_ID }}
        continue-on-error: true  # 上传失败不阻断整个流程
  
  # ==================== 任务3: 验证 Android 构建 (确保无回归) ====================
  verify-android:
    name: 🤖 Verify Android Build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
      
      - name: ☕ Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DIST }}
      
      - name: 📦 Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      
      - name: 🤖 Build Android APK (Debug)
        run: |
          ./gradlew :composeApp:assembleDebug \
                    --no-daemon \
                    --build-cache \
                    --stacktrace
      
      - name: 📤 Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: composeApp/build/outputs/apk/debug/*.apk
          retention-days: 7
  
  # ==================== 任务4: 构建总结通知 ====================
  notify:
    name: 📋 Build Summary
    runs-on: ubuntu-latest
    needs: [build-ios-framework, verify-android]
    if: always()
    
    steps:
      - name: 📊 Generate Build Summary
        run: |
          echo "## 🚀 EditLetterChat 构建报告" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 平台 | 状态 | 产物 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| 📱 iOS Framework | ${{ needs.build-ios-framework.result == 'success' && '✅ 成功' || '❌ 失败' }} | [下载](../actions/runs/${{ github.run_id }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| 🤖 Android | ${{ needs.verify-android.result == 'success' && '✅ 成功' || '❌ 失败' }} | [下载](../actions/runs/${{ github.run_id }}) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**构建信息**" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- 触发者: @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- 时间: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
