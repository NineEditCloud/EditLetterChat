name: Build iOS & macOS

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:   # 支持手动触发

jobs:
  build:
    runs-on: macos-14   # 可用最新的 macOS 环境，支持 Xcode 16+
    strategy:
      matrix:
        target: [ios, macos]   # 分别构建，也可合并到一个 job 中
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      # ---------- Kotlin / Gradle 环境 ----------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      
      # 构建 Kotlin 模块 (假设共享模块名为 :shared)
      - name: Build Kotlin Framework (shared)
        run: ./gradlew :shared:assembleXCFramework   # 如果使用 XCFramework
        # 也可换成 :shared:linkDebugFrameworkIosArm64 等
      
      # ---------- Apple 签名准备 ----------
      - name: Install Apple Certificate (iOS/macOS)
        if: matrix.target == 'ios'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_DIST_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # 创建临时钥匙串，导入发布证书
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          
          # 导入 .p12 证书
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -k $KEYCHAIN_PATH -P "$P12_PASSWORD" -A
          
          # 允许本工具使用证书
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH login.keychain
      
      # 安装 mobileprovision 描述文件
      - name: Install Provisioning Profile (iOS)
        if: matrix.target == 'ios'
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode -o $RUNNER_TEMP/profile.mobileprovision
          cp $RUNNER_TEMP/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
      
      # ---------- Xcode 构建与打包 ----------
      - name: Build iOS Archive & Export IPA
        if: matrix.target == 'ios'
        run: |
          xcodebuild -workspace iosApp/iosApp.xcworkspace \
            -scheme iosApp \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $RUNNER_TEMP/iosApp.xcarchive \
            archive \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}" \
            CODE_SIGN_IDENTITY="${{ secrets.IOS_CODE_SIGN_IDENTITY }}"
          
          # 导出 IPA
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/iosApp.xcarchive \
            -exportOptionsPlist iosApp/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/export \
            CODE_SIGN_STYLE=Manual
          
          # 重命名便于识别
          mv $RUNNER_TEMP/export/*.ipa $RUNNER_TEMP/export/iosApp-${{ github.run_number }}.ipa
      
      - name: Build macOS App & Archive
        if: matrix.target == 'macos'
        run: |
          xcodebuild -workspace macosApp/macosApp.xcworkspace \
            -scheme macosApp \
            -sdk macosx \
            -configuration Release \
            -derivedDataPath $RUNNER_TEMP/DerivedData \
            build
          
          # 可将 .app 打包成 dmg 或直接归档
          APP_PATH=$(find $RUNNER_TEMP/DerivedData -name "*.app" -type d | head -1)
          zip -r $RUNNER_TEMP/macosApp-${{ github.run_number }}.app.zip "$APP_PATH"
      
      # ---------- 上传产物 ----------
      - name: Upload iOS IPA
        if: matrix.target == 'ios'
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ${{ runner.temp }}/export/*.ipa
      
      - name: Upload macOS App
        if: matrix.target == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: ${{ runner.temp }}/macosApp-*.app.zip