name: tmate ssh (macOS)

on:
  workflow_dispatch:   # 手动触发

jobs:
  debug:
    runs-on: macos-latest    # 可按需改为 macos-13、macos-14
#    timeout-minutes: 3600      # 限制最长调试时间
    
    steps:
      - name: 安装并启动 tmate
        run: |
          brew install tmate
          # -F 开启前台模式，-N 设置会话名
          tmate -F -n debug-session &
          sleep 3
          # 从日志里提取 SSH 连接字符串
          tmate show-messages | grep "ssh session"
          echo "看到连接地址后，请在本地终端连接。"
      - name: 保持会话
        run: sleep 3600
        # 可选配置项
        # with:
        #   limit-access-to-actor: true  # 只有触发者本人能连，更安全