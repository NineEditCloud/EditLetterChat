# ============================================================
# 🚀 KMP 自动化构建 - macOS & iOS [v5]
#
# 关键修复：
#   ✅ macOS: 使用 packageDmg 而非不存在的 linkReleaseFrameworkMacos*
#   ✅ iOS:   保留全架构 framework 编译 + 增强错误日志
#   ✅ 产物:  用正确路径上传
# ============================================================

name: AppleAuto Build (macOS & iOS)

on:
  push:
    branches: [ main, master, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2"
  JAVA_VERSION: '17'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  
  # ==================== 任务1: macOS DMG ====================
  build-macos:
    name: 🖥️ Build macOS DMG
    runs-on: macos-14
    timeout-minutes: 60
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🔑 Grant Execute Permission
        run: chmod +x gradlew
      
      - name: ☕ Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
      
      - name: 📦 Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: 'on-success'
          add-job-summary-as-pr-comment: always
      
      # ---- 编译并打包 macOS DMG ----
      - name: 🔨 Build macOS DMG
        id: build-macos
        run: |
          echo "========== 编译 macOS 桌面应用 (JVM) =========="
          
          ./gradlew :composeApp:packageDmg \
                    --no-daemon --build-cache --stacktrace 2>&1 | tee build-macos.log || {
            echo ""
            echo "❌ packageDmg 失败！错误日志："
            tail -60 build-macos.log
            echo ""
            echo "尝试仅编译验证..."
            ./gradlew :composeApp:compileKotlinJvm --no-daemon --stacktrace || {
              echo "❌ JVM 编译也失败了"
              exit 1
            }
          }
          
          # 查找 DMG 产物
          echo ""
          echo "--- 查找 DMG 产物 ---"
          DMG_FILE=$(find composeApp/build -name "*.dmg" -type f 2>/dev/null | head -1)
          if [ -n "$DMG_FILE" ]; then
            echo "✅ 找到 DMG: $DMG_FILE"
            echo "dmg_found=true" >> "$GITHUB_OUTPUT"
            echo "dmg_path=$DMG_FILE" >> "$GITHUB_OUTPUT"
          else
            echo "⚠️ 未找到 DMG 文件"
            echo "dmg_found=false" >> "$GITHUB_OUTPUT"
            echo "--- 搜索其他产物 ---"
            find composeApp/build -type f -name "*.jar" -o -name "*.app" 2>/dev/null | head -10 || true
          fi
          echo "build_status=success" >> "$GITHUB_OUTPUT"
      
      # ---- 收集并上传产物 ----
      - name: 📦 Package & Collect Artifacts
        if: always()
        run: |
          mkdir -p "$GITHUB_WORKSPACE/output/macOS"
          
          # 复制 DMG
          DMG=$(find composeApp/build -name "*.dmg" -type f 2>/dev/null | head -1)
          if [ -n "$DMG" ]; then
            cp "$DMG" "$GITHUB_WORKSPACE/"
            echo "📦 已复制 DMG: $(basename "$DMG")"
          
            # 同时复制到 output 目录
            cp "$DMG" "$GITHUB_WORKSPACE/output/macOS/"
          fi
          
          # 复制 JAR (备选)
          JARS=$(find composeApp/build -name "*.jar" -type f 2>/dev/null | head -5)
          if [ -n "$JARS" ]; then
            for jar in $JARS; do
              cp "$jar" "$GITHUB_WORKSPACE/output/macOS/" 2>/dev/null || true
            done
            echo "📦 已复制 JAR 文件"
          fi
          
          # 列出收集到的文件
          echo ""
          echo "========== 已收集的产物 =========="
          ls -la "$GITHUB_WORKSPACE/"*.dmg 2>/dev/null || echo "(无 DMG)"
          ls -la "$GITHUB_WORKSPACE/output/macOS/" 2>/dev/null || echo "(output 目录为空)"
      
      - name: 📤 Upload macOS Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-app-${{ github.run_id }}
          path: |
            *.dmg
            output/macOS/**
          retention-days: 7
          if-no-files-found: warn
  
  # ==================== 任务2: iOS Framework准备 ====================
  build-ios-framework:
    name: 📱 Build iOS Framework
    runs-on: macos-14
    timeout-minutes: 90
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🔑 Grant Execute Permission
        run: chmod +x gradlew
      
      - name: ☕ Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
      
      - name: 📦 Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: 'on-success'
          add-job-summary-as-pr-comment: always
      
      # ---- 先运行 pod install ----
      - name: 🌿 CocoaPods Install
        working-directory: ./iosApp
        run: |
          if [ -f "Podfile" ]; then
            echo ">>> 运行 pod install..."
            pod install --repo-update 2>&1 || pod install 2>&1
            echo ">>> 验证 Pods 目录..."
            ls -la Pods/WechatOpenSDK/OpenSDK2.0.4/ 2>/dev/null || echo "⚠️ WechatOpenSDK 目录不存在"
            ls -la Pods/WechatOpenSDK/ 2>/dev/null || echo "⚠️ WechatOpenSDK 目录不存在"
            ls -la Pods/AlipaySDK-iOS/ 2>/dev/null || echo "⚠️ AlipaySDK-iOS 目录不存在"
            ls -laR Pods/OneSignal/ 2>/dev/null | head -30 || (echo "❌ OneSignal Pod 未安装！" && exit 1)
          else
            echo "ℹ️ 无Podfile，跳过"
          fi
          
      - name: Debug OneSignal Pod structure
        run: |
          echo "=== OneSignal Pod 目录 ==="
          ls -la iosApp/Pods/OneSignal/ || echo "目录不存在"
          echo "=== 查找 .xcframework ==="
          find iosApp/Pods/OneSignal -name "*.xcframework" -type d 2>/dev/null || echo "未找到 xcframework"
          echo "=== 查找头文件 ==="
          find iosApp/Pods/OneSignal -name "*.h" 2>/dev/null | head -20 || echo "未找到头文件"
      - name: Debug OneSignal headers
        run: |
          echo "=== OneSignal_Core Headers ==="
          ls iosApp/Pods/OneSignal/iOS_SDK/OneSignalSDK/OneSignal_Core/Headers/ 2>/dev/null
          echo "=== OneSignalFramework Headers ==="
          ls iosApp/Pods/OneSignal/iOS_SDK/OneSignalSDK/OneSignal_XCFramework/OneSignalFramework.xcframework/ios-arm64/OneSignalFramework.framework/Headers/ 2>/dev/null
    
    
      # ---- 编译 iOS Framework (逐个编译便于定位错误) ----
      - name: 🔨 Build iOS - iosArm64 (真机)
        id: build-ios-arm64
        run: |
          set -o pipefail
          
          # 新增：导出大内存环境变量
          export JAVA_OPTS="-Xmx4g -XX:MaxMetaspaceSize=512m"
          export GRADLE_OPTS="-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m"
          
          # 新增：Kotlin/Native 额外内存配置
          export KOTLIN_NATIVE_OPTS="-Xmx4096m"
          
          echo ">>> 编译 iosArm64 Release..."
          ./gradlew :composeApp:linkReleaseFrameworkIosArm64 \
                    --no-daemon --build-cache --stacktrace 2>&1 | tee ios-arm64.log
          echo "✅ iosArm64 Release 成功"
      
      
      - name: 🔨 Build iOS - iosSimulatorArm64 (M芯片模拟器)
        id: build-ios-sim
        run: |
          set -o pipefail
          echo ">>> 编译 iosSimulatorArm64 Release..."
          ./gradlew :composeApp:linkReleaseFrameworkIosSimulatorArm64 \
                    --no-daemon --build-cache --stacktrace 2>&1 | tee ios-sim.log
          echo "✅ iosSimulatorArm64 Release 成功"
      
      - name: 🔨 Build iOS - iosX64 (Intel模拟器)
        id: build-ios-x64
        run: |
          set -o pipefail
          echo ">>> 编译 iosX64 Release..."
          ./gradlew :composeApp:linkReleaseFrameworkIosX64 \
                    --no-daemon --build-cache --stacktrace 2>&1 | tee ios-x64.log
          echo "✅ iosX64 Release 成功"
      
      # ---- 收集产物 ----
      - name: 📦 Collect iOS Artifacts
        if: always()
        run: |
          echo "========== 探测 iOS 构建产物 =========="
          mkdir -p "$GITHUB_WORKSPACE/output/iOS"
          
          # 列出完整的 build 目录结构
          echo "--- composeApp/build/bin/ 结构 ---"
          find composeApp/build/bin -maxdepth 4 -type d 2>/dev/null | head -30 || true
          echo ""
          
          # 搜索 .framework
          FRAMEWORKS=$(find composeApp/build -type d -name "*.framework" 2>/dev/null)
          if [ -n "$FRAMEWORKS" ]; then
            echo "✅ 找到 Framework:"
            echo "$FRAMEWORKS"
            for fw in $FRAMEWORKS; do
              cp -r "$fw" "$GITHUB_WORKSPACE/output/iOS/" 2>/dev/null || true
            done
          else
            echo "⚠️ 未找到 .framework 文件"
          fi
          
          # 搜索 .klib
          KLIBS=$(find composeApp/build -type f -name "*.klib" 2>/dev/null)
          if [ -n "$KLIBS" ]; then
            echo "✅ 找到 .klib 文件"
            for klib in $KLIBS; do
              cp "$klib" "$GITHUB_WORKSPACE/output/iOS/" 2>/dev/null || true
            done
          fi
          
          echo ""
          echo "========== output/iOS 内容 =========="
          ls -laR "$GITHUB_WORKSPACE/output/iOS/" 2>/dev/null || echo "(空)"
      
      - name: 📤 Upload iOS Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-frameworks-${{ github.run_id }}
          path: output/iOS/**
          retention-days: 14
          if-no-files-found: warn
      
      # ---- 失败时显示错误日志摘要 ----
      - name: 📋 Show Error Log (on failure)
        if: failure()
        run: |
          echo "========== 错误日志摘要 =========="
          for log in ios-arm64.log ios-sim.log ios-x64.log; do
            if [ -f "$log" ]; then
              echo ""
              echo "--- $log (最后50行) ---"
              tail -50 "$log" 2>/dev/null || true
            fi
          done
  
  # ==================== 任务3: iOS IPA ====================
  build-ios-ipa:
    name: 🍎 Build iOS IPA (Auto Sign)
    runs-on: macos-14
    needs: build-ios-framework
    timeout-minutes: 90
    if: github.event_name != 'pull_request'
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🔑 Grant Execute Permission
        run: chmod +x gradlew
      
      - name: ☕ Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
      
      - name: 📦 Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: 'on-success'
      
      - name: 🌿 CocoaPods Install
        working-directory: ./iosApp
        run: |
          if [ -f "Podfile" ]; then
            pod install --repo-update || pod install
          else
            echo "ℹ️ 无 Podfile，跳过"
          fi
      
      - name: 🔨 Build iOS Framework (单架构 + 大内存)
        run: |
          export JAVA_OPTS="-Xmx4g -XX:MaxMetaspaceSize=512m"
          export GRADLE_OPTS="-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=1 -Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m"
          
          echo ">>> [1/3] 编译 iosArm64 Release..."
          ./gradlew :composeApp:linkReleaseFrameworkIosArm64 \
                    :composeApp:linkReleaseFrameworkIosSimulatorArm64 \
                    --no-daemon --build-cache
                    --no-daemon --build-cache --stacktrace 2>&1 | tee ios-arm64.log
          
          echo ">>> [2/3] 编译 iosSimulatorArm64 Release..."
          ./gradlew :composeApp:linkReleaseFrameworkIosSimulatorArm64 \
                    --no-daemon --build-cache --stacktrace 2>&1 | tee ios-sim-log
          
          echo ">>> [3/3] 编译 iosX64 Release..."
          ./gradlew :composeApp:linkReleaseFrameworkIosX64 \
                    --no-daemon --build-cache --stacktrace 2>&1 | tee ios-x64.log
          
          echo "✅ iOS Framework 编译完成"
      
      - name: 🔑 Read Team ID
        id: team-id
        run: |
          # 优先使用 GitHub Secret，否则从 Config.xcconfig 读取
          if [ -n "${{ secrets.DEVELOPER_TEAM_ID }}" ]; then
            echo "TEAM_ID=${{ secrets.DEVELOPER_TEAM_ID }}" >> "$GITHUB_OUTPUT"
            echo "📌 使用 Secrets 中的 Team ID"
          elif [ -f iosApp/Configuration/Config.xcconfig ]; then
            TID=$(grep -oP 'TEAM_ID=\K.*' iosApp/Configuration/Config.xcconfig | head -1 | xargs)
            if [ -n "$TID" ]; then
              echo "TEAM_ID=$TID" >> "$GITHUB_OUTPUT"
              echo "📌 使用 Config.xcconfig 中的 Team ID: $TID"
            else
              echo "TEAM_ID=" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "TEAM_ID=" >> "$GITHUB_OUTPUT"
          fi
      
      - name: 🏗️ Archive & Export IPA
        id: ipa-build
        working-directory: ./iosApp
        continue-on-error: true
        run: |
          TEAM_ID="${{ steps.team-id.outputs.TEAM_ID }}"
          
          if [ -z "$TEAM_ID" ]; then
            echo "⚠️ 未配置 Apple Developer Team ID"
            echo "   请在 GitHub Secrets 中添加 DEVELOPER_TEAM_ID，"
            echo "   或在 iosApp/Configuration/Config.xcconfig 中设置 TEAM_ID"
            echo "success=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          
          echo ">>> 使用 Team ID: $TEAM_ID"
          
          cat > ExportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>compileBitcode</key>
              <false/>
              <key>destination</key>
              <string>export</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>teamID</key>
              <string></string>
              <string>_PLACEHOLDER_</string>
          </dict>
          </plist>
          EOF
          sed -i '' "s/_PLACEHOLDER_/$TEAM_ID/" ExportOptions.plist
          
          SCHEME_NAME="iosApp"
          if [ -f "iosApp.xcworkspace/xcshareddata/xcschemes/${SCHEME_NAME}.xcscheme" ]; then
            WORKSPACE_PATH="-workspace iosApp.xcworkspace"
          else
            WORKSPACE_PATH="-project iosApp.xcodeproj"
          fi
          
          echo ">>> Archive..."
          set -o pipefail
          xcodebuild ${WORKSPACE_PATH} \
            -scheme "${SCHEME_NAME}" \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/iosApp.xcarchive" \
            archive \
            CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM="" \
            -quiet | xcpretty || {
            DEVELOPMENT_TEAM="$TEAM_ID" \
            2>&1 | tee archive.log
          ARCHIVE_EXIT=$?
          
          if [ $ARCHIVE_EXIT -ne 0 ]; then
            echo ">>> Release Archive 失败, 尝试 Debug..."
            xcodebuild ${WORKSPACE_PATH} \
              -scheme "${SCHEME_NAME}" \
              -sdk iphoneos \
              -configuration Debug \
              -archivePath "$RUNNER_TEMP/iosApp-debug.xcarchive" \
              -archivePath "$RUNNER_TEMP/iosApp.xcarchive" \
              archive \
              CODE_SIGN_STYLE=Automatic \
              -allowProvisioningUpdates \
              DEVELOPMENT_TEAM="" \
              -quiet | xcpretty
            RUNNER_TEMP_ARCHIVE="$RUNNER_TEMP/iosApp-debug.xcarchive"
          }
              DEVELOPMENT_TEAM="$TEAM_ID" \
              2>&1 | tee archive-debug.log || {
              echo "❌ Archive 失败, 请检查签名配置"
              echo "success=false" >> "$GITHUB_OUTPUT"
              exit 0
            }
          fi
          
          ARCHIVE_PATH="${RUNNER_TEMP_ARCHIVE:-$RUNNER_TEMP/iosApp.xcarchive}"
          echo ">>> Export IPA..."
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -archivePath "$RUNNER_TEMP/iosApp.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -quiet | xcpretty || {
            echo "⚠️ IPA 导出失败"
            exit 1
            2>&1 | tee export.log || {
            echo "⚠️ IPA 导出失败, 签名可能有问题"
            echo "success=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          
          if ls "$RUNNER_TEMP/export/"*.ipa 1>/dev/null 2>&1; then
            mv "$RUNNER_TEMP/export/"*.ipa "$RUNNER_TEMP/EditLetterChat-auto-${{ github.run_number }}.ipa"
            echo "success=true" >> "$GITHUB_OUTPUT"
            echo "✅ IPA 生成成功: $RUNNER_TEMP/EditLetterChat-auto-${{ github.run_number }}.ipa"
          else
            echo "❌ 未找到 .ipa 文件"
            echo "success=false" >> "$GITHUB_OUTPUT"
          fi
      
      - name: 📤 Upload iOS IPA
        if: steps.ipa-build.outputs.success == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-auto-${{ github.run_id }}
          path: ${{ runner.temp }}/EditLetterChat-auto-*.ipa
          retention-days: 7
  
  # ==================== 任务4: 报告 ====================
  report:
    name: 📊 Build Report
    runs-on: ubuntu-latest
    needs: [build-macos, build-ios-framework, build-ios-ipa]
    if: always()
    
    steps:
      - name: 📋 Generate Summary
        run: |
          echo "# 🚀 EditLetterChat 构建" > $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 平台 | 状态 | 产物 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|------|" >> $GITHUB_STEP_SUMMARY
          
          case "${{ needs.build-macos.result }}" in
            success) S="✅ 成功" ;; failure) S="❌ 失败" ;; *) S="⏳ 跳过" ;;
          esac
          echo "| 🖥️ **macOS** | ${S} | [下载](../actions/runs/${{ github.run_id }}) |" >> $GITHUB_STEP_SUMMARY
          
          case "${{ needs.build-ios-framework.result }}" in
            success) S="✅ 成功" ;; failure) S="❌ 失败" ;; *) S="⏳ 跳过" ;;
          esac
          echo "| 📱 **iOS FW** | ${S} | [下载](../actions/runs/${{ github.run_id }}) |" >> $GITHUB_STEP_SUMMARY
          
          case "${{ needs.build-ios-ipa.result }}" in
            success) S="✅ 成功" ;; skipped) S="⏭️ 跳过" ;; failure) S="❌ 需配置" ;; *) S="-" ;;
          esac
          echo "| 🍎 **iOS IPA** | ${S} | [下载](../actions/runs/${{ github.run_id }}) |" >> $GITHUB_STEP_SUMMARY
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\` | **分支:** \`${{ github.ref_name }}\` | **触发:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY

