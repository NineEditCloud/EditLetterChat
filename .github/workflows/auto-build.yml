# ============================================================
# 🚀 KMP 自动化构建 - macOS & iOS (Xcode自动签名) [v3 已修复]
#
# ✨ 特点：
#   • 无需任何 Secrets 配置（零门槛）
#   • 使用 Xcode 自动签名（-allowProvisioningUpdates）
#   • 一键运行，开箱即用
#   • 支持 macOS App + iOS Framework + iOS IPA
#
# ⚠️ 限制：
#   • iOS IPA 仅限免费开发者账号（7天过期）
#   • 正式发布需配置手动签名（参考 build-kmp-ios.yml）
# 修复内容：
#   ✅ gradlew 执行权限
#   ✅ Deprecation 警告 (gradle-home-cache-cleanup → cache-cleanup)
#   ✅ KMP 产物路径修正
#   ✅ 增强调试输出
# ============================================================

name: AppleAuto Build (macOS & iOS)

on:
  push:
    branches: [ main, master, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=4"
  JAVA_VERSION: '21'
  XCODE_VERSION: '16.2'

jobs:
  
  # ==================== 任务1: macOS ====================
  build-macos:
    name: 🖥️ Build macOS App
    runs-on: macos-14
    timeout-minutes: 60
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      # ---- 🔑 赋予执行权限 ----
      - name: 🔑 Grant Execute Permission
        run: chmod +x gradlew
      
      # ---- 配置 JDK ----
      - name: ☕ Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
      
      # ---- Gradle 缓存 (已更新参数名) ----
      - name: 📦 Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: true                    # ✅ 新参数名
          add-job-summary-as-pr-comment: always
      
      # ---- 授权 Xcode ----
      - name: 🔑 Accept Xcode License
        run: |
          sudo xcodebuild -license accept
          sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer || true
      
      # ---- 编译 macOS Framework ----
      - name: 🔨 Build Kotlin Framework (macOS)
        id: build-macos
        run: |
          echo "========== macOS Native Framework =========="
          
          ./gradlew --version | head -5
          
          ./gradlew :composeApp:linkReleaseFrameworkMacosArm64 \
                    :composeApp:linkReleaseFrameworkMacosX64 \
                    --no-daemon --build-cache --stacktrace || {
            echo "⚠️ Release 失败，尝试 Debug..."
            ./gradlew :composeApp:linkDebugFrameworkMacosArm64 \
                      :composeApp:linkDebugFrameworkMacosX64 --no-daemon
          }
          
          echo ""
          echo "========== 输出文件列表 =========="
          find composeApp/build/bin -type d -name "*.framework" 2>/dev/null || true
          find composeApp/build/bin -type d -name "*.klib" 2>/dev/null || true
          ls -laR composeApp/build/bin/macos*/ 2>/dev/null | head -30 || true
      
      # ---- 收集并打包产物 ----
      - name: 📦 Collect Artifacts
        if: always()
        run: |
          mkdir -p "$GITHUB_WORKSPACE/output"
          
          # KMP 项目生成的是 .framework 或 .klib 文件
          echo "========== 收集 macOS 产物 =========="
          
          # 方法1: 查找 .framework 文件
          FRAMEWORKS=$(find composeApp/build/bin/macos* -maxdepth 3 -name "*.framework" -type d 2>/dev/null)
          
          if [ -n "$FRAMEWORKS" ]; then
            echo "✅ 找到 Framework:"
            echo "$FRAMEWORKS"
          
            mkdir -p "$GITHUB_WORKSPACE/output/macOS-frameworks"
            for fw in $FRAMEWORKS; do
              cp -r "$fw" "$GITHUB_WORKSPACE/output/macOS-frameworks/" 2>/dev/null || true
            done
          
            # 打包成 zip
            cd "$GITHUB_WORKSPACE/output"
            zip -r "$RUNNER_TEMP/EditLetterChat-macos-${{ github.run_id }}.zip" macOS-frameworks/
            mv "$RUNNER_TEMP/"*.zip "$GITHUB_WORKSPACE/"
          
            echo "📦 打包完成: EditLetterChat-macos-${{ github.run_id }}.zip"
          else
            # 方法2: 查找 .klib 文件
            KLIBS=$(find composeApp/build/bin/macos* -name "*.klib" -type f 2>/dev/null)
          
            if [ -n "$KLIBS" ]; then
              echo "✅ 找到 KLib 文件:"
              echo "$KLIBS"
          
              mkdir -p "$GITHUB_WORKSPACE/output/macOS-klibs"
              cp $KLIBS "$GITHUB_WORKSPACE/output/macOS-klibs/" 2>/dev/null || true
          
              cd "$GITHUB_WORKSPACE/output"
              zip -r "$RUNNER_TEMP/EditLetterChat-macos-${{ github.run_id }}.zip" macOS-klibs/
              mv "$RUNNER_TEMP/"*.zip "$GITHUB_WORKSPACE/"
          
              echo "📦 打包完成 (KLib格式)"
            else
              echo "⚠️ 未找到任何产物"
              echo "--- build 目录结构 ---"
              find composeApp/build -maxdepth 4 -type f -o -type d 2>/dev/null | head -40 || true
            fi
          fi
      
      # ---- 上传产物 ----
      - name: 📤 Upload macOS Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-app-${{ github.run_id }}
          path: |
            EditLetterChat-macos-*.zip
            output/macOS-frameworks/**/*.framework
            output/macOS-klibs/*.klib
          retention-days: 7
          if-no-files-found: warn
  
  # ==================== 任务2: iOS Framework ====================
  build-ios-framework:
    name: 📱 Build iOS Framework
    runs-on: macos-14
    timeout-minutes: 90
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🔑 Grant Execute Permission
        run: chmod +x gradlew
      
      - name: ☕ Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
      
      - name: 📦 Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: true                     # ✅ 新参数名
          add-job-summary-as-pr-comment: always
      
      - name: 🔑 Accept Xcode License
        run: |
          sudo xcodebuild -license accept
          sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer || true
      
      # ---- 编译 iOS 全架构 Framework ----
      - name: 🔨 Build Kotlin Framework (iOS All Architectures)
        id: build-ios
        run: |
          echo "========== iOS Native Framework =========="
          echo "目标架构:"
          echo "  • iosArm64 (真机)"
          echo "  • iosSimulatorArm64 (M系列模拟器)"
          echo "  • iosX64 (Intel模拟器)"
          echo "==========================================="
          
          ./gradlew --version | head -5
          
          # 先尝试编译 iosArm64 和 iosSimulatorArm64 (最常用的两个)
          echo ""
          echo ">>> 开始 Release 构建..."
          ./gradlew :composeApp:linkReleaseFrameworkIosArm64 \
                    :composeApp:linkReleaseFrameworkIosSimulatorArm64 \
                    --no-daemon --build-cache --info --stacktrace 2>&1 | tee build.log || {
            echo ""
            echo ">>> ⚠️ Release 构建失败，查看错误日志:"
            tail -50 build.log
            echo ""
            echo ">>> 尝试 Debug 构建..."
            ./gradlew :composeApp:linkDebugFrameworkIosArm64 \
                      :composeApp:linkDebugFrameworkIosSimulatorArm64 \
                      --no-daemon --info 2>&1 | tee debug-build.log || {
              echo ""
              echo "❌ Debug 也失败了！最后50行日志:"
              tail -50 debug-build.log
              exit 1
            }
            echo "::set-output name=build_type::debug"
          }
          
          echo ""
          echo "✅ iOS Framework 编译完成！"
          echo "--- 输出文件 ---"
          find composeApp/build/bin/ios* -name "*.framework" -type d 2>/dev/null || true
          find composeApp/build/bin/ios* -name "*.klib" -type f 2>/dev/null || true
          echo "::set-output name=build_type::release"
      
      # ---- 上传 Framework ----
      - name: 📤 Upload iOS Frameworks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-frameworks-${{ github.run_id }}
          path: |
            composeApp/build/bin/ios*/**/*.framework
            composeApp/build/bin/ios*/**/*.klib
          retention-days: 14
          if-no-files-found: warn
  
  # ==================== 任务3: iOS IPA (保持不变) ====================
  build-ios-ipa:
    name: 🍎 Build iOS IPA (Auto Sign)
    runs-on: macos-14
    needs: build-ios-framework
    timeout-minutes: 90
    
    if: github.event_name != 'pull_request'
    
    steps:
      - name: 🔍 Check iOS Project Exists
        id: check-ios
        run: |
          if [ -d "iosApp" ]; then
            echo "::set-output name=exists::true"
          else
            echo "::set-output name=exists::false"
          fi
      
      - name: 📥 Checkout
        if: steps.check-ios.outputs.exists == 'true'
        uses: actions/checkout@v4
      
      - name: 🔑 Grant Execute Permission
        if: steps.check-ios.outputs.exists == 'true'
        run: chmod +x gradlew
      
      - name: ☕ Setup JDK ${{ env.JAVA_VERSION }}
        if: steps.check-ios.outputs.exists == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
      
      - name: 📦 Setup Gradle
        if: steps.check-ios.outputs.exists == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: true                     # ✅ 新参数名
      
      - name: 🔑 Accept Xcode License
        if: steps.check-ios.outputs.exists == 'true'
        run: |
          sudo xcodebuild -license accept
          sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer || true
      
      - name: 🌿 CocoaPods Install
        if: steps.check-ios.outputs.exists == 'true'
        working-directory: ./iosApp
        run: |
          if [ -f "Podfile" ]; then
            pod install --repo-update || pod install
          else
            echo "ℹ️ 无 Podfile，跳过"
          fi
      
      - name: 🔨 Rebuild iOS Framework
        if: steps.check-ios.outputs.exists == 'true'
        run: |
          ./gradlew :composeApp:linkReleaseFrameworkIosArm64 \
                    :composeApp:linkReleaseFrameworkIosSimulatorArm64 \
                    --no-daemon --build-cache
      
      - name: 🏗️ Archive & Export IPA (Auto Sign)
        id: ipa-build
        if: steps.check-ios.outputs.exists == 'true'
        working-directory: ./iosApp
        continue-on-error: true
        run: |
          cat > ExportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>compileBitcode</key>
              <false/>
              <key>destination</key>
              <string>export</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>teamID</key>
              <string></string>
          </dict>
          </plist>
          EOF
          
          WORKSPACE_PATH=""
          SCHEME_NAME="iosApp"
          
          if [ -f "iosApp.xcworkspace/xcshareddata/xcschemes/${SCHEME_NAME}.xcscheme" ]; then
            WORKSPACE_PATH="-workspace iosApp.xcworkspace"
          elif [ -f "../iosApp.xcworkspace/xcshareddata/xcschemes/${SCHEME_NAME}.xcscheme" ]; then
            WORKSPACE_PATH="-workspace ../iosApp.xcworkspace"
          else
            WORKSPACE_PATH="-project iosApp.xcodeproj"
          fi
          
          xcodebuild ${WORKSPACE_PATH} \
                     -scheme "${SCHEME_NAME}" \
                     -sdk iphoneos \
                     -configuration Release \
                     -archivePath "$RUNNER_TEMP/iosApp.xcarchive" \
                     archive \
                     CODE_SIGN_STYLE=Automatic \
                     -allowProvisioningUpdates \
                     DEVELOPMENT_TEAM="" \
                     CODE_SIGN_IDENTITY="Apple Development" \
                     -quiet | xcpretty || {
          
            xcodebuild ${WORKSPACE_PATH} \
                       -scheme "${SCHEME_NAME}" \
                       -sdk iphoneos \
                       -configuration Debug \
                       -archivePath "$RUNNER_TEMP/iosApp-debug.xcarchive" \
                       archive \
                       CODE_SIGN_STYLE=Automatic \
                       -allowProvisioningUpdates \
                       DEVELOPMENT_TEAM="" \
                       CODE_SIGN_IDENTITY="Apple Development" \
                       -quiet | xcpretty
          
            RUNNER_TEMP_ARCHIVE="$RUNNER_TEMP/iosApp-debug.xcarchive"
          }
          
          ARCHIVE_PATH="${RUNNER_TEMP_ARCHIVE:-$RUNNER_TEMP/iosApp.xcarchive}"
          
          xcodebuild -exportArchive \
                     -archivePath "$ARCHIVE_PATH" \
                     -exportOptionsPlist ExportOptions.plist \
                     -exportPath "$RUNNER_TEMP/export" \
                     -allowProvisioningUpdates \
                     -quiet | xcpretty || {
            echo "⚠️ IPA 导出失败"
            exit 1
          }
          
          if ls "$RUNNER_TEMP/export/"*.ipa 1>/dev/null 2>&1; then
            mv "$RUNNER_TEMP/export/"*.ipa "$RUNNER_TEMP/EditLetterChat-auto-${{ github.run_number }}.ipa"
            echo "::set-output name=success::true"
          else
            echo "::set-output name=success::false"
          fi
      
      - name: 📤 Upload iOS IPA
        if: steps.ipa-build.outputs.success == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-auto-${{ github.run_id }}
          path: ${{ runner.temp }}/EditLetterChat-auto-*.ipa
          retention-days: 7
      
      - name: 💡 IPA Build Info
        if: steps.ipa-build.outputs.success != 'true' && steps.check-ios.outputs.exists == 'true'
        run: |
          echo "## ℹ️ iOS IPA 构建说明" >> $GITHUB_STEP_SUMMARY
          echo "**失败原因:**" >> $GITHUB_STEP_SUMMARY
          echo "| 原因 | 解决方案 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|----------|" >> $GITHUB_STEP_SUMMARY
          echo "| 未注册 Apple 开发者 | 在 GitHub Codesigning 添加 Apple ID |" >> $GITHUB_STEP_SUMMARY
          echo "| 测试设备未注册 | 注册设备 UUID |" >> $GITHUB_STEP_SUMMARY
          echo "| Bundle ID 冲突 | 修改 Bundle Identifier |" >> $GITHUB_STEP_SUMMARY
  
  # ==================== 任务4: 报告 ====================
  report:
    name: 📊 Build Report
    runs-on: ubuntu-latest
    needs: [build-macos, build-ios-framework, build-ios-ipa]
    if: always()
    
    steps:
      - name: 📋 Generate Summary
        run: |
          echo "# 🚀 EditLetterChat 构建结果" > $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 平台 | 状态 | 产物 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|------|" >> $GITHUB_STEP_SUMMARY
          
          MAC_RESULT="${{ needs.build-macos.result }}"
          case "$MAC_RESULT" in
            success)   MAC_STATUS="✅ 成功" ;;
            failure)   MAC_STATUS="❌ 失败" ;;
            cancelled) MAC_STATUS="🚫 已取消" ;;
            *)         MAC_STATUS="⏳ 跳过" ;;
          esac
          echo "| 🖥️ **macOS App** | ${MAC_STATUS} | [📥 下载](../actions/runs/${{ github.run_id }}) |" >> $GITHUB_STEP_SUMMARY
          
          IOS_FW_RESULT="${{ needs.build-ios-framework.result }}"
          case "$IOS_FW_RESULT" in
            success)   IOS_FW_STATUS="✅ 成功" ;;
            failure)   IOS_FW_STATUS="❌ 失败" ;;
            cancelled) IOS_FW_STATUS="🚫 已取消" ;;
            *)         IOS_FW_STATUS="⏳ 跳过" ;;
          esac
          echo "| 📱 **iOS Framework** | ${IOS_FW_STATUS} | [📥 下载](../actions/runs/${{ github.run_id }}) |" >> $GITHUB_STEP_SUMMARY
          
          IPA_RESULT="${{ needs.build-ios-ipa.result }}"
          case "$IPA_RESULT" in
            success)   IPA_STATUS="✅ 成功" ;;
            failure)   IPA_STATUS="❌ 失败/需配置" ;;
            skipped)   IPA_STATUS="⏭️ 已跳过" ;;
            cancelled) IPA_STATUS="🚫 已取消" ;;
            *)         IPA_STATUS="⏳ 未运行" ;;
          esac
          echo "| 🍎 **iOS IPA** | ${IPA_STATUS} | [📥 下载](../actions/runs/${{ github.run_id }}) |" >> $GITHUB_STEP_SUMMARY
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "**构建信息**" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- 分支: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- 触发者: @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- 时间: $(date '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
