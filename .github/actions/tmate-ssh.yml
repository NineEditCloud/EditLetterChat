name: tmate ssh (macOS)

on:
  workflow_dispatch:   # 手动触发

jobs:
  debug:
    runs-on: macos-latest    # 可按需改为 macos-13、macos-14
    timeout-minutes: 30      # 限制最长调试时间
    
    steps:
      - name: 检出代码（如需）
        uses: actions/checkout@v4
      
      - name: 通过 tmate 开启远程 SSH 会话
        uses: mxschmitt/action-tmate@v3
        # 可选配置项
        # with:
        #   limit-access-to-actor: true  # 只有触发者本人能连，更安全