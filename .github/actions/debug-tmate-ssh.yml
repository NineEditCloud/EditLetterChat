# ============================================================
# 🔍 GitHub Actions 调试用 - tmate SSH 远程登录
#
# 用法: 在 auto-build.yml 的任何 job 的 steps 中引用：
#   - name: 🔍 SSH Debug
#     uses: ./.github/actions/debug-tmate-ssh
#     timeout-minutes: 30  # 30分钟后自动断开
#
# 启动后查看日志中的 SSH 连接命令：
#   ssh xxxxx@nyc1.tmate.io  或  https://tmate.io/t/xxxxx
# ============================================================

name: Debug via tmate SSH
description: 启动 tmate SSH 会话，允许远程登录 GitHub Actions runner 进行调试

runs:
  using: "composite"
  steps:
    - name: 🛠️ Install & Start tmate
      shell: bash
      run: |
        # 安装 tmate（macOS 用 brew，Linux 用 apt）
        if [[ "$RUNNER_OS" == "macOS" ]]; then
          brew install tmate
        elif [[ "$RUNNER_OS" == "Linux" ]]; then
          sudo apt-get update -qq && sudo apt-get install -y -qq tmate
        fi

        # 生成 SSH 密钥对
        mkdir -p ~/.ssh
        ssh-keygen -t rsa -b 4096 -f ~/.ssh/tmate_rsa -N "" -q

        # 启动 tmate，等待连接建立
        echo ""
        echo "⏳ 正在启动 tmate SSH 会话..."
        echo "=================================================="
        tmate -S /tmp/tmate.sock new-session -d
        tmate -S /tmp/tmate.sock wait tmate-ready

        # 打印 Web 端连接 URL（无需 SSH 客户端）
        WEB_URL=$(tmate -S /tmp/tmate.sock display -p '#{tmate_web}')
        echo ""
        echo "🌐 Web 终端:  ${WEB_URL}"
        echo "   （在浏览器中打开即可，无需 SSH 客户端）"
        echo ""

        # 打印 SSH 连接命令
        SSH_CMD=$(tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}')
        echo "💻 SSH 命令:  ${SSH_CMD}"
        echo "=================================================="
        echo ""

        # 保持会话直到被手动终止或超时
        echo "⏰ 会话将保持到 timeout 或你手动 cancel workflow..."
        while true; do
          sleep 60
          echo "  [$(date '+%H:%M:%S')] SSH 会话运行中..."
        done
